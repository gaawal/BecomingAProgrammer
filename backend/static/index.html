<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>程序员职场养成系统 MVP</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
      :root {font-family: "JetBrains Mono", monospace; color: #d6e4ff; background: #0d1117;}
      body {margin: 0; background: radial-gradient(circle at top, #14213d, #0d1117 45%);}
      .layout {max-width: 1080px; margin: 0 auto; padding: 24px;}
      .grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 14px;}
      .card {background: rgba(19,27,45,.85); border: 1px solid #1f2a44; border-radius: 12px; padding: 14px;}
      .row {display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px dashed #2a3c5f; padding: 9px 0;}
      .row:last-child {border-bottom: none;}
      .meta {font-size: 12px; color: #8aa2c8;}
      button {border: 0; border-radius: 8px; color: #fff; background: linear-gradient(135deg,#2563eb,#16a34a); padding: 8px 12px; cursor: pointer;}
      button:disabled {background:#3b475d; cursor:not-allowed;}
      .progress {width:100%;height:10px;background:#21314f;border-radius:999px;overflow:hidden;}
      .bar {height:100%;background:linear-gradient(90deg,#1dd3b0,#3b82f6);}
      .toast {color:#1dd3b0;} .error {color:#f97316;}
    </style>
  </head>
  <body>
    <main id="app" class="layout"></main>
    <script>
      const { createApp, ref, computed, onMounted } = Vue;
      const USER_ID = 'u1001';
      const TEAM_ID = 'team-a';

      const request = async (url, options = {}) => {
        const resp = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...options});
        if (!resp.ok) {
          const e = await resp.json().catch(() => ({message: 'request failed'}));
          throw new Error(e.message || 'request failed');
        }
        return resp.json();
      };

      createApp({
        setup() {
          const loading = ref(true), error = ref(''), toast = ref('');
          const user = ref(null), tasks = ref([]), team = ref(null), rewards = ref([]);
          const levelProgress = computed(() => {
            if (!user.value) return 0;
            const thresholds = [0, 200, 500, 900, 1400];
            const lv = user.value.level, current = user.value.points;
            const start = thresholds[lv - 1] ?? 0, end = thresholds[lv] ?? (start + 500);
            return Math.min(100, Math.round(((current - start) / (end - start)) * 100));
          });
          const fetchAll = async () => {
            loading.value = true;
            try {
              const [u, t, tm, rw] = await Promise.all([
                request(`/api/users/${USER_ID}`),
                request(`/api/tasks?user_id=${USER_ID}`),
                request(`/api/teams/${TEAM_ID}`),
                request('/api/rewards')
              ]);
              user.value = u; tasks.value = t; team.value = tm; rewards.value = rw; error.value = '';
            } catch (e) { error.value = e.message; }
            finally { loading.value = false; }
          };

          const completeTask = async (taskId) => {
            try {
              await request(`/api/tasks/${taskId}/complete`, {method:'POST', body: JSON.stringify({reviewer_passed: true})});
              toast.value = '任务完成，积分已发放';
              await fetchAll();
            } catch (e) { toast.value = `任务失败：${e.message}`; }
          };

          const redeem = async (rewardId) => {
            try {
              await request('/api/rewards/redeem', {method:'POST', body: JSON.stringify({user_id: USER_ID, reward_id: rewardId})});
              toast.value = '奖励兑换成功';
              await fetchAll();
            } catch (e) { toast.value = `兑换失败：${e.message}`; }
          };

          onMounted(fetchAll);
          return { loading, error, toast, user, tasks, team, rewards, levelProgress, completeTask, redeem };
        },
        template: `
          <header><h1>程序员职场养成系统 · Flask单机MVP</h1><p>工作完成 → 积分增长 → 伙伴升级 → 奖励解锁</p></header>
          <p v-if="toast" class="toast">{{ toast }}</p>
          <p v-if="error" class="error">错误：{{ error }}</p>
          <section v-if="loading" class="card">加载中...</section>
          <template v-else>
            <section class="grid">
              <article class="card">
                <h2>个人养成</h2>
                <p><strong>{{ user.name }}</strong> · {{ user.department }} · {{ user.title }}</p>
                <p>虚拟伙伴：{{ user.partner.name }}（{{ user.partner.status }}）</p>
                <p>积分：{{ user.points }} · 等级：Lv.{{ user.level }}</p>
                <div class="progress"><div class="bar" :style="{width: levelProgress + '%'}"></div></div>
                <p>技术树：{{ user.tech_tree.join(' / ') }}</p>
              </article>
              <article class="card">
                <h2>工作任务</h2>
                <div v-for="task in tasks" :key="task.id" class="row">
                  <div><div>{{ task.title }}</div><div class="meta">{{ task.project }} · 难度 {{ task.difficulty }} · {{ task.status }}</div></div>
                  <button :disabled="task.status==='done'" @click="completeTask(task.id)">{{ task.status==='done' ? '已完成' : '完成任务' }}</button>
                </div>
              </article>
            </section>
            <section class="grid">
              <article class="card">
                <h2>团队协作</h2>
                <p><strong>{{ team.name }}</strong> · 排名 #{{ team.rank }}</p>
                <p>团队积分：{{ team.points }}</p>
                <p>团队成就：{{ team.unlocked.join('、') }}</p>
              </article>
              <article class="card">
                <h2>奖励兑换</h2>
                <div v-for="reward in rewards" :key="reward.id" class="row">
                  <div><div>{{ reward.name }}</div><div class="meta">消耗 {{ reward.cost }} 分 · 库存 {{ reward.stock }}</div></div>
                  <button :disabled="reward.stock===0" @click="redeem(reward.id)">兑换</button>
                </div>
              </article>
            </section>
          </template>
        `
      }).mount('#app');
    </script>
  </body>
</html>
